name: offline-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: python -m pip install build
      - run: python -m build
      - name: Install wheel in isolated environment and validate offline
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/vpn-keeper-smoke"
          "$RUNNER_TEMP/vpn-keeper-smoke/bin/python" -m pip install --no-index --no-deps dist/*.whl
          config="$GITHUB_WORKSPACE/examples/config.toml"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/vpn-keeper-smoke/bin/vpn-keeper" --help
          "$RUNNER_TEMP/vpn-keeper-smoke/bin/vpn-keeper" --config "$config" validate
